name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/run_tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node src/tests/test_yaw_widget.mjs
      - run: node src/tests/test_test_bench.mjs
      - run: python tools/check_repo.py
      - run: python tools/build_mods.py
      - run: ./tools/build_launcher.ps1
      - run: python tools/build_release.py
